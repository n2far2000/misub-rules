# 目标客户端格式: sing-box
#
# 【MiSub 识别格式要点 - 改动前务必先看 docs/internals.md】
#   1. MiSub 只识别 [custom] / [proxy group] / [rule] 三个 section，其它一律忽略。
#   2. 规则统一写成 ruleset= 行以完整保留顺序；写进 [rule] 会被 MiSub 提到所有
#      ruleset= 之前，顺序被打乱。
#   3. ruleset=<策略组>,<URL> 生成 rule-provider；ruleset=<策略组>,[]TYPE,VALUE
#      生成内联原生规则（[]FINAL 会渲染成 MATCH）。
#   4. custom_proxy_group= 的成员必须真实存在，否则 MiSub 的
#      pruneEmptyGroups 会剪掉空组，并连带删除指向它的规则。
#   5. 成员语法: []名称 = 引用其它组 / .* = 全部节点 / (正则) = 按正则筛选；
#      url-test 末尾是 间隔,,容差(秒)。
#   6. MiSub 判断 rule-provider 的 behavior 只靠文件名白名单，不在白名单里
#      一律 classical，因此本文件的规则集必须是完整规则语法（DOMAIN-SUFFIX,x）。
#      直接引用上游裸域名 payload 会导致客户端规则解析失败。
#   7. 规则顺序严格复刻 Loyalsoldier README 的「白名单模式」推荐顺序。
# ============================================================

[custom]


# ---- 🎯 全球直连 · 内联 DOMAIN,clash.razord.top ----
ruleset=🎯 全球直连,[]DOMAIN,clash.razord.top
ruleset=🎯 全球直连,[]DOMAIN,yacd.haishan.me

# ---- 🏠 私有网络 · 私有网络域名 ----
ruleset=🏠 私有网络,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/private.json

# ---- 🛑 广告拦截 · 广告与跟踪域名 ----
ruleset=🛑 广告拦截,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/reject.json

# ---- 🚀 节点选择 · 代理域名 ----
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/proxy.json

# ---- 🎯 全球直连 · 直连域名 ----
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/direct.json
ruleset=🎯 全球直连,[]GEOIP,CN

# ---- 🐟 漏网之鱼 · 白名单兜底：未命中即走代理 ----
ruleset=🐟 漏网之鱼,[]FINAL

# ==================== 策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]DIRECT`[]REJECT`.*
custom_proxy_group=⚡ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🏠 私有网络`select`[]DIRECT`[]REJECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT
