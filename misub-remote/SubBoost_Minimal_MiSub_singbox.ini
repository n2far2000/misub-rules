# ============================================================
# SubBoost 精简版规则 -> MiSub 远程规则集模板 (sing-box)
# 由 subboost2misub.mjs 自动生成于 2026-10-10
# 上游: github.com/SubBoost/subboost @ a7177d7
#
# 【本文件与内联版的区别】
#   规则内容不写死在 ini 里, 而是指向托管在 CDN 上的规则集文件。
#   客户端会按 24h 自动重拉这些规则集, 因此改规则无需重导 ini。
#
# 【只适用于一种内核】
#   本文件是为 sing-box 生成的, 不要给另一个内核用:
#   MiSub 的 sing-box 渲染器只看扩展名: .srs -> binary, 其余 -> source;
#   sing-box 的 source 格式只支持 JSON, 所以托管文件是 JSON。
#
# 【MiSub 通用格式要点】
#   1. 只识别 [custom] / [proxy group] / [rule] 三个 section。
#   2. 全部规则走 ruleset= 行以保留顺序; [rule] 的行会被前置到最前。
#   3. custom_proxy_group= 成员必须真实存在, 空组会被剪枝并连带删规则。
# ============================================================

[custom]

# ---- 🛑 广告拦截 ----
ruleset=🛑 广告拦截,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/sb-ad.json

# ---- 🏠 私有网络 ----
ruleset=🏠 私有网络,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/sb-private.json

# ---- 🔒 国内服务 ----
ruleset=🔒 国内服务,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/sb-cn.json

# ---- 🌍 非中国 ----
ruleset=🌍 非中国,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/sb-global.json

# ---- 🔒 国内服务 ----
ruleset=🔒 国内服务,https://cdn.jsdelivr.net/gh/n2far2000/misub-rules@dist/rules/singbox/sb-cn-2.json

# ---- 最终兜底 ----
ruleset=🐟 漏网之鱼,[]FINAL

# ==================== 策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]DIRECT`[]REJECT`.*
custom_proxy_group=⚡ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🏠 私有网络`select`[]DIRECT`[]REJECT`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]REJECT`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🌍 非中国`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT

enable_rule_generator=true
overwrite_original_rules=true
