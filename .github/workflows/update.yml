name: Update rules from Loyalsoldier

# 生成层：定时拉取 Loyalsoldier/clash-rules 的规则集，转换成
#   · Clash/Mihomo 可用的 classical 规则集（DOMAIN-SUFFIX / IP-CIDR 语法）
#   · sing-box 可用的 source 规则集（version 3 JSON）
#   · 按目标策略组合并的聚合规则集（agg-*，见 docs/plan-aggregation-and-distribution.md）
# 再生成 MiSub 自定义规则模板（ini），一并发布到 dist 分支。
#
# 一致性契约（本地与 CI 必须走同一套改写逻辑）：
#   1. 本地与 CI 调用同一个 scripts/loyalsoldier2misub.mjs，参数只差 --dist 路径；
#   2. CI 内做「幂等性回归」：用同一份缓存离线重建一次，再用
#      scripts/check-consistency.mjs 逐文件比对（仅归一化生成时间戳）；
#   3. 发布后再从 raw 拉关键产物做结构性断言，确认线上内容与构建结果一致。
#
# 为什么发布到独立的 dist 分支：
#   产物约 36 MB，且规则内容每天都在变。若提交进 main 分支，
#   一年下来仓库会膨胀到数 GB。dist 分支每次用「孤立提交 + 强制推送」重建，
#   仓库体积恒等于单次产物大小；推送本身也算仓库活动，
#   可避免公共仓库连续 60 天无活动被自动禁用 schedule。

on:
  schedule:
    # UTC 20:17 = 北京时间 04:17。刻意避开整点，GitHub 在整点负载最高、延迟最大。
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 即使上游 commit 未变化也强制重建 dist
        type: boolean
        default: true
  # 改写逻辑一旦变更（生成器 / 校验器 / 本文件），立即重建一次，
  # 保证线上产物与仓库里的规则改写代码同步，不需要等次日定时任务。
  push:
    branches: [main]
    paths:
      - "scripts/**.mjs"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-misub-rules
  cancel-in-progress: false

env:
  # 生成器读这里作为上游缓存，--offline 复跑时复用，保证幂等性校验用的是同一份输入
  CACHE_DIR: ${{ github.workspace }}/.work/loyalsoldier

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate dist
        id: generate
        env:
          # 用于解析上游 commit，避免匿名调用撞上 60 次/小时的共享限额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/loyalsoldier2misub.mjs \
            --dist "$RUNNER_TEMP/dist-out" \
            --all-presets \
            --cache-dir "$CACHE_DIR" \
            --gh-owner "${{ github.repository_owner }}" \
            --gh-repo "${{ github.event.repository.name }}" \
            --gh-ref dist \
            --verify

      # ---------------------------------------------------------------
      # 一致性校验：同一份缓存 + 同一份脚本，离线重建一次，必须逐字节相同。
      # 这是「本地与 CI 改写逻辑一致」的可执行证据：
      # 任何人本地跑同样两条命令，得到的结果必须与 CI 一致。
      # ---------------------------------------------------------------
      - name: Consistency check (deterministic rebuild)
        run: |
          set -euo pipefail
          SHA=$(jq -r '.source.commit' "$RUNNER_TEMP/dist-out/manifest.json")
          echo "上游 commit: $SHA"
          node scripts/loyalsoldier2misub.mjs \
            --dist "$RUNNER_TEMP/dist-check" \
            --all-presets \
            --cache-dir "$CACHE_DIR" \
            --offline \
            --upstream-commit "$SHA" \
            --gh-owner "${{ github.repository_owner }}" \
            --gh-repo "${{ github.event.repository.name }}" \
            --gh-ref dist \
            --verify
          node scripts/check-consistency.mjs \
            --left "$RUNNER_TEMP/dist-out" \
            --right "$RUNNER_TEMP/dist-check"

      - name: Read manifest
        id: manifest
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/dist-out/manifest.json"
          {
            echo "upstream_commit=$(jq -r '.source.commit' "$M")"
            echo "rule_sets=$(jq -r '.ruleSets | length' "$M")"
            echo "aggregates=$(jq -r '.aggregates | length' "$M")"
            echo "entries=$(jq -r '[.ruleSets[].count] | add' "$M")"
            echo "full_entries=$(jq -r '.presets.Full.entries' "$M")"
            echo "agg4_entries=$(jq -r '.presets.Agg4.entries' "$M")"
            echo "agg4_providers=$(jq -r '.presets.Agg4.providers' "$M")"
            echo "files=$(find "$RUNNER_TEMP/dist-out" -type f | wc -l)"
            echo "bytes=$(find "$RUNNER_TEMP/dist-out" -type f -printf '%s\n' | awk '{s+=$1} END {print s}')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.manifest.outputs.upstream_commit }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/publish"
          rm -rf "$PUB" && mkdir -p "$PUB"
          cd "$PUB"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r "$RUNNER_TEMP/dist-out/." .
          git add -A
          git commit -q -m "chore(rules): rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ) upstream=${UPSTREAM_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin dist

          # 推送内容与产物目录必须一一对应
          LOCAL=$(find "$RUNNER_TEMP/dist-out" -type f | wc -l)
          REMOTE=$(git ls-tree -r --name-only HEAD | wc -l)
          echo "产物文件数 本地=$LOCAL 已提交=$REMOTE"
          [ "$LOCAL" = "$REMOTE" ] || { echo "FAIL: 提交文件数与产物不一致"; exit 1; }

      - name: Verify published files
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/dist"
          # 只校验 raw（无分支引用缓存，推送后立即可见）。
          # jsDelivr 的刷新由后续 Purge 步骤保证，不走这条通道做门禁。
          PATHS=(
            "misub/Loyalsoldier_Full_MiSub.ini"
            "misub/Loyalsoldier_Standard_MiSub.ini"
            "misub/Loyalsoldier_Minimal_MiSub.ini"
            "misub/Loyalsoldier_Agg4_MiSub.ini"
            "misub/SubBoost_Full_MiSub.ini"
            "misub/SubBoost_Standard_MiSub.ini"
            "misub/SubBoost_Minimal_MiSub.ini"
            "misub-remote/Loyalsoldier_Full_MiSub_clash.ini"
            "misub-remote/Loyalsoldier_Full_MiSub_singbox.ini"
            "misub-remote/Loyalsoldier_Agg4_MiSub_clash.ini"
            "misub-remote/Loyalsoldier_Agg4_MiSub_singbox.ini"
            "misub-remote/SubBoost_Full_MiSub_clash.ini"
            "misub-remote/SubBoost_Full_MiSub_singbox.ini"
            "misub-fast/Loyalsoldier_Agg4_MiSub.ini"
            "misub-remote-fast/Loyalsoldier_Agg4_MiSub_clash.ini"
            "misub-remote-fast/Loyalsoldier_Agg4_MiSub_singbox.ini"
            "rules/clash/reject.yaml"
            "rules/clash/direct.yaml"
            "rules/clash/agg-private.yaml"
            "rules/clash/agg-ad.yaml"
            "rules/clash/agg-proxy.yaml"
            "rules/clash/agg-direct.yaml"
            "rules/singbox/reject.json"
            "rules/singbox/agg-direct.json"
            "manifest.json"
          )
          fail=0
          fetch_retry() {
            local url="$1" out="$2" code=""
            for i in 1 2 3 4 5; do
              code=$(curl -s -o "$out" -w '%{http_code}' -m 30 "$url" || true)
              [ "$code" = "200" ] && { echo "$code"; return 0; }
              sleep 5
            done
            echo "$code"; return 1
          }
          for p in "${PATHS[@]}"; do
            TMP=$(mktemp)
            if code=$(fetch_retry "$BASE/$p" "$TMP"); then
              echo "OK   $p ($(wc -c < "$TMP") B)"
            else
              echo "FAIL $p ($code)"
              fail=1
            fi
            rm -f "$TMP"
          done

          # 结构性断言：线上 Agg4 必须是「4 个远程规则集 + FINAL」，防止内容回退成散装 10 表
          TMP=$(mktemp)
          fetch_retry "$BASE/misub/Loyalsoldier_Agg4_MiSub.ini" "$TMP" > /dev/null || { echo "FAIL Agg4 ini 不可读"; exit 1; }
          REMOTE_SETS=$(grep -c '^ruleset=.*https://' "$TMP" || true)
          PROVIDERS=$(grep -c '^ruleset=.*rules/clash/agg-' "$TMP" || true)
          FINAL=$(grep -c '^ruleset=.*\[\]FINAL' "$TMP" || true)
          echo "Agg4: 远程规则集 $REMOTE_SETS / 聚合引用 $PROVIDERS / FINAL $FINAL"
          [ "$REMOTE_SETS" = "4" ] || { echo "FAIL: Agg4 远程规则集应为 4，实际 $REMOTE_SETS"; fail=1; }
          [ "$PROVIDERS" = "4" ] || { echo "FAIL: Agg4 聚合引用应为 4，实际 $PROVIDERS"; fail=1; }
          [ "$FINAL" = "1" ] || { echo "FAIL: Agg4 应恰有 1 条 FINAL，实际 $FINAL"; fail=1; }
          rm -f "$TMP"

          # 加速通道断言：内层 URL 必须指向 gh-proxy，且不能出现裸 raw 直链
          # （裸 raw 会被 MiSub 的 pinRemoteRuleUrl 改写回 jsDelivr，加速失效）
          TMP=$(mktemp)
          fetch_retry "$BASE/misub-remote-fast/Loyalsoldier_Agg4_MiSub_clash.ini" "$TMP" > /dev/null \
            || { echo "FAIL: fast 版 ini 不可读"; exit 1; }
          FAST_PROXY=$(grep -c '^ruleset=.*https://gh-proxy.com/' "$TMP" || true)
          FAST_RAW=$(grep -c '^ruleset=.*https://raw\.githubusercontent\.com/' "$TMP" || true)
          FAST_SP=$(grep -c '^ruleset=.*rules/clash/agg-' "$TMP" || true)
          echo "fast: gh-proxy 引用 $FAST_PROXY / 裸 raw $FAST_RAW / clash 聚合 $FAST_SP"
          [ "$FAST_PROXY" = "4" ] || { echo "FAIL: fast 版应有 4 条 gh-proxy 引用，实际 $FAST_PROXY"; fail=1; }
          [ "$FAST_RAW" = "0" ] || { echo "FAIL: fast 版不应出现裸 raw 直链，实际 $FAST_RAW"; fail=1; }
          [ "$FAST_SP" = "4" ] || { echo "FAIL: fast 版 clash 聚合引用应为 4，实际 $FAST_SP"; fail=1; }
          rm -f "$TMP"
          exit $fail

      # ---------------------------------------------------------------
      # jsDelivr 缓存失效（否则客户端会拿到「旧版规则集」）
      #
      # jsDelivr 对「分支引用」的解析结果缓存 12 小时
      #   （响应头 Cache-Control: public, max-age=604800, s-maxage=43200）
      # 每次 force push 到 dist 之后，@dist 仍可能在部分边缘节点被解析成
      # 上一个 commit，客户端下载到的规则集内容就还是旧的 ——
      # 这正是 2026-10-19 上报的「链接中的规则集还是旧版的」的根因。
      #
      # 这里对全部产物路径主动 purge，把最长 12 小时的滞后压到几十秒。
      # purge 无需鉴权，接口返回 {"status":"finished"}。
      # ---------------------------------------------------------------
      - name: Purge jsDelivr cache
        id: purge
        run: |
          set -euo pipefail
          BASE="https://purge.jsdelivr.net/gh/${{ github.repository }}@dist"
          # 加速通道产物（misub-fast/、misub-remote-fast/）里的内层 URL 指向
          # gh-proxy，不经过 jsDelivr，purge 它们必然是 404，直接排除。
          find "$RUNNER_TEMP/dist-out" -type f \
            | sed "s#^$RUNNER_TEMP/dist-out/##" | sort \
            | grep -vE '^misub(-remote)?-fast/' > "$RUNNER_TEMP/purge.txt"
          TOTAL=$(wc -l < "$RUNNER_TEMP/purge.txt")
          echo "待 purge: $TOTAL 个路径"
          ok=0; bad=0
          while IFS= read -r p; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$BASE/$p" || echo 000)
              [ "$code" = "200" ] && break
              sleep 3
            done
            if [ "$code" = "200" ]; then
              ok=$((ok+1))
            else
              echo "  purge FAIL $p ($code)"
              bad=$((bad+1))
            fi
            sleep 0.4
          done < "$RUNNER_TEMP/purge.txt"
          echo "purge 成功 $ok / 失败 $bad"
          {
            echo "ok=$ok"
            echo "bad=$bad"
          } >> "$GITHUB_OUTPUT"
          # purge 失败不阻断发布（12 小时后 CDN 会自愈），但必须显式留痕
          [ "$bad" -eq 0 ] || echo "::warning::有 $bad 个路径 purge 失败，最长 12 小时后自愈"

      # 观测 CDN 是否已切到本次构建。
      #
      # 注意：这一步**不能做硬门禁**。jsDelivr 对分支引用 `@dist` 的解析结果
      # 是按边缘节点缓存的，purge 只能清文件，推不动「分支 → commit」这一层。
      # 实测（2026-10-19）同一时刻 cdn 边缘解析到 #22 的 commit、fastly 解析到 #23，
      # 而 raw 已是 #24；purge 全部路径后仍然如此，最长 12 小时后自然收敛。
      # 所以这里只报告状态，不因 CDN 滞后让发布失败 —— 产物本身已由
      # "Verify published files"（raw 通道）和一致性校验保证正确。
      - name: Report jsDelivr propagation
        run: |
          set -euo pipefail
          BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist"
          sleep 30
          stale=0
          for p in \
            "rules/clash/reject.yaml" \
            "rules/clash/agg-ad.yaml" \
            "rules/singbox/reject.json" \
            "misub/Loyalsoldier_Agg4_MiSub.ini" \
            "manifest.json" ; do
            WANT=$(md5sum "$RUNNER_TEMP/dist-out/$p" | cut -d' ' -f1)
            GOT=""
            for attempt in 1 2 3; do
              if curl -s -f -m 60 "$BASE/$p" -o "$RUNNER_TEMP/cdn.bin"; then
                GOT=$(md5sum "$RUNNER_TEMP/cdn.bin" | cut -d' ' -f1)
                [ "$GOT" = "$WANT" ] && break
              fi
              sleep 10
            done
            if [ "$GOT" = "$WANT" ]; then
              echo "FRESH $p"
            else
              echo "STALE $p（CDN 仍是旧构建，分支解析缓存导致，最长 12h 自愈）"
              stale=$((stale+1))
            fi
            rm -f "$RUNNER_TEMP/cdn.bin"
          done
          if [ "$stale" -eq 0 ]; then
            echo "CDN 已全部切到本次构建"
          else
            echo "::warning::$stale/5 个路径的 CDN 仍是旧构建（jsDelivr 分支引用缓存，属预期行为）"
          fi

      - name: Summary
        run: |
          {
            echo "## Loyalsoldier → MiSub 规则已更新"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 commit | \`${{ steps.manifest.outputs.upstream_commit }}\` |"
            echo "| 原始规则集 | ${{ steps.manifest.outputs.rule_sets }} 张 |"
            echo "| 聚合规则集 | ${{ steps.manifest.outputs.aggregates }} 张 |"
            echo "| 规则条目总数 | ${{ steps.manifest.outputs.entries }} |"
            echo "| 完整版条目数 | ${{ steps.manifest.outputs.full_entries }} |"
            echo "| 聚合版条目数 | ${{ steps.manifest.outputs.agg4_entries }}（provider ${{ steps.manifest.outputs.agg4_providers }}） |"
            echo "| 产物文件数 | ${{ steps.manifest.outputs.files }} |"
            echo "| 产物体积 | $(echo "${{ steps.manifest.outputs.bytes }}" | awk '{printf "%.2f MB", $1/1048576}') |"
            echo "| CDN purge | ${{ steps.purge.outputs.ok }} 成功 / ${{ steps.purge.outputs.bad }} 失败 |"
            echo ""
            echo "一致性校验：幂等重建逐字节一致 ✅"
            echo ""
            echo "### 预设对照"
            echo ""
            echo "| 预设 | 规则集数 | 策略组 | 说明 |"
            echo "|---|---|---|---|"
            echo "| Full | 10 | 10 | 精度最高，细分开关最全 |"
            echo "| Standard | 6 | 6 | 去掉 iCloud/Apple/Google/Telegram 细分 |"
            echo "| Minimal | 4 | 6 | 不含 IP 表，靠 GEOIP,CN 兜底 |"
            echo "| **Agg4** | **4** | **6** | 10 张表按策略组合并，弱网/老设备推荐 |"
            echo ""
            echo "### 主链接（保持不变）"
            echo ""
            echo "\`\`\`"
            echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/misub/SubBoost_Full_MiSub.ini"
            echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/misub/Loyalsoldier_Full_MiSub.ini"
            echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/misub/Loyalsoldier_Agg4_MiSub.ini"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
