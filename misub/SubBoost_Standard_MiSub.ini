# ============================================================
# SubBoost 标准版规则 -> MiSub 自定义规则模板 (ini)
# 由 subboost2misub.mjs 自动生成于 2026-10-10
# 上游: github.com/SubBoost/subboost @ a7177d7
#
# 【MiSub 识别格式要点 - 不要随意改动结构】
#   1. MiSub 只识别 [custom] / [proxy group] / [rule] 三个 section, 其它一律忽略。
#   2. 规则统一用 ruleset= 行表达以完整保留顺序; 写进 [rule] 会被 MiSub
#      排到所有 ruleset= 之前, 顺序被打乱。
#   3. custom_proxy_group= 的成员必须真实存在, 否则 MiSub 的
#      applySmartModelOptimizations 会剪掉空组, 并连带删除指向它的全部规则。
#   4. 成员语法: []名称 = 引用其它组 / .* = 全部节点 / (正则) = 按正则筛选;
#      url-test 末位为 间隔,,容差(秒)。
#   5. []GEOSITE,xxx / []GEOIP,xxx 为内联语法: Clash 出原生规则,
#      sing-box 自动映射 SagerNet .srs —— 双端都正确, 无需额外托管。
#   6. 规则顺序严格复刻 SubBoost rules.ts 的 buildCanonicalRuleEntries()。
# ============================================================

[custom]

# ---- 🛑 广告拦截 ----
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

# ---- 🏠 私有网络 ----
ruleset=🏠 私有网络,[]GEOSITE,private
ruleset=🏠 私有网络,[]GEOIP,private

# ---- 🤖 AI 服务 ----
ruleset=🤖 AI 服务,[]GEOSITE,openai
ruleset=🤖 AI 服务,[]GEOSITE,anthropic
ruleset=🤖 AI 服务,[]GEOSITE,category-ai-chat-!cn

# ---- 🔒 国内服务 ----
ruleset=🔒 国内服务,[]GEOSITE,geolocation-cn
ruleset=🔒 国内服务,[]GEOIP,CN

# ---- 📹 油管视频 ----
ruleset=📹 油管视频,[]GEOSITE,youtube

# ---- 🔍 谷歌服务 ----
ruleset=🔍 谷歌服务,[]GEOSITE,google
ruleset=🔍 谷歌服务,[]GEOIP,google

# ---- 📲 电报消息 ----
ruleset=📲 电报消息,[]GEOSITE,telegram
ruleset=📲 电报消息,[]GEOIP,telegram

# ---- 🐱 代码托管 ----
ruleset=🐱 代码托管,[]GEOSITE,github
ruleset=🐱 代码托管,[]GEOSITE,gitlab
ruleset=🐱 代码托管,[]GEOSITE,atlassian

# ---- Ⓜ️ 微软服务 ----
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=Ⓜ️ 微软服务,[]GEOSITE,onedrive

# ---- 🍏 苹果服务 ----
ruleset=🍏 苹果服务,[]GEOSITE,apple
ruleset=🍏 苹果服务,[]GEOSITE,icloud

# ---- 🌍 非中国 ----
ruleset=🌍 非中国,[]GEOSITE,geolocation-!cn

# ---- 🔒 国内服务 (低置信国内补充) ----
ruleset=🔒 国内服务,[]GEOSITE,cn

# ---- 最终兜底 ----
ruleset=🐟 漏网之鱼,[]FINAL

# ==================== 策略组 ====================
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]DIRECT`[]REJECT`.*
custom_proxy_group=⚡ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🏠 私有网络`select`[]DIRECT`[]REJECT`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]REJECT`[]🚀 节点选择`[]⚡ 自动选择
custom_proxy_group=🌍 非中国`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🤖 AI 服务`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🔍 谷歌服务`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🍏 苹果服务`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🐱 代码托管`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT

enable_rule_generator=true
overwrite_original_rules=true
